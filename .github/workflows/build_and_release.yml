name: Build & Release FedMind Mobile (Android)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for Release (e.g. v0.2.0 or v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build Release APK (ARM64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Prepare Release APK
        run: |
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/fedmind-app-release.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedmind-android-apk
          path: release_assets/fedmind-app-release.apk
          retention-days: 14

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v0.1.0"
          fi
          echo "TAG=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG }}
          name: "FedMind Mobile CDSS (${{ steps.tag_info.outputs.TAG }})"
          body: |
            ## 📱 Unduh Aplikasi FedMind Mobile (Android)

            Rilis resmi aplikasi prototipe **FedMind Mobile** (*On-Device Multimodal Clinical Decision Support System* untuk skrining risiko depresi dengan Explainable AI / XAI).

            ### 📦 File Unduhan Tersedia:
            - **Android (`fedmind-app-release.apk`)**: Unduh langsung di HP Android (Android 13+ / `arm64-v8a`), buka file `.apk`, dan izinkan *"Install from unknown sources"*.

            ---
            *Otomatis dibangun dengan GitHub Actions (Flutter Stable, ONNX Runtime Edge Engine — Android Only).*
          files: release_assets/fedmind-app-release.apk
          overwrite_files: true
          make_latest: true
          draft: false
          prerelease: false
