name: Build & Release FedMind Mobile

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for Release (e.g. v1.0.0 or v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Artifact
        run: |
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/fedmind-app-release.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedmind-android-apk
          path: release_assets/fedmind-app-release.apk
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Application (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Payload to IPA
        run: |
          mkdir -p release_assets
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../release_assets/fedmind-ios.ipa Payload
          cd ../../..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedmind-ios-ipa
          path: release_assets/fedmind-ios.ipa
          retention-days: 30

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        if: needs.build-android.result == 'success'
        with:
          name: fedmind-android-apk
          path: release_files

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        if: needs.build-ios.result == 'success'
        with:
          name: fedmind-ios-ipa
          path: release_files

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v0.1.0"
          fi
          echo "TAG=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG }}
          name: "FedMind Mobile CDSS (${{ steps.tag_info.outputs.TAG }})"
          body: |
            ## 📱 Unduh Aplikasi FedMind Mobile (CDSS Multimodal Depression Screening)

            Rilis resmi aplikasi prototipe FedMind Mobile untuk skrining risiko depresi multimodal on-device dengan Explainable AI (XAI).

            ### 📦 File Unduhan Tersedia:
            - **Android (`fedmind-app-release.apk`)**: Unduh langsung di HP Android, buka file `.apk`, dan izinkan "Install from unknown sources".
            - **iOS (`fedmind-ios.ipa`)**: Unduh file `.ipa`, pasang ke iPhone menggunakan tool sideloading gratis seperti [Sideloadly](https://sideloadly.io) atau [AltStore](https://altstore.io).

            ---
            *Otomatis dibangun dengan GitHub Actions (Flutter Stable, ONNX Runtime Edge Engine).*
          files: release_files/*
          draft: false
          prerelease: false
